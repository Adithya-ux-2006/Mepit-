<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 100" fill="none">
  <!-- Logo Mark: rounded rectangle split diagonally -->
  <clipPath id="roundedRect">
    <rect x="0" y="4" width="92" height="92" rx="24" ry="24"/>
  </clipPath>
  <g clip-path="url(#roundedRect)">
    <!-- Left half - bright green -->
    <rect x="0" y="4" width="46" height="92" fill="#7ED321"/>
    <!-- Right half - dark green -->
    <rect x="46" y="4" width="46" height="92" fill="#1A6E3B"/>
    <!-- Diagonal blend -->
    <polygon points="30,4 62,4 46,96 30,96" fill="#1A6E3B" opacity="0.5"/>
  </g>
  <!-- Stylized G letterform in white -->
  <path d="M72 32C72 22 63 16 52 16C41 16 32 22 32 32V64C32 74 41 80 52 80C58 80 63 78 66 74L58 68C56 70 54 71 52 71C46 71 43 67 43 64V32H55V40H68C67.5 44 67 48 67 48L72 32Z" fill="white" opacity="0.95"/>
  <!-- Wordmark: GRÜNE DESIGNS -->
  <text x="108" y="48" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="30" fill="#3D3D3D" letter-spacing="-0.5">GR</text>
  <text x="167" y="48" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="30" fill="#7ED321" letter-spacing="-0.5">Ü</text>
  <text x="195" y="48" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="30" fill="#3D3D3D" letter-spacing="-0.5">NE</text>
  <text x="108" y="80" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="30" fill="#3D3D3D" letter-spacing="-0.5">DESIGNS</text>
  <!-- Tagline -->
  <text x="108" y="96" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="9" fill="#888888" letter-spacing="3">FUTURE PROOF BUILDINGS</text>
</svg>
